<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GlassAgent connected-device foreground service reviewer demonstration.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#087d59">
  <title>GlassAgent Connected Device Demonstration</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f8f6;
      color: #101713;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100% - 32px, 760px); margin: 0 auto; padding: 48px 0 64px; }
    header { margin-bottom: 28px; }
    .eyebrow { margin: 0 0 10px; color: #087d59; font-size: 14px; font-weight: 700; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(32px, 7vw, 48px); line-height: 1.08; }
    p { max-width: 680px; margin: 16px 0 0; color: #536058; font-size: 16px; line-height: 1.65; }
    .video-frame { padding: 12px; border: 1px solid #ced8d2; border-radius: 8px; background: #ffffff; }
    video { display: block; width: min(100%, 390px); margin: 0 auto; border-radius: 4px; background: #101713; }
    a { color: #087d59; text-underline-offset: 4px; }
    .fallback { margin-top: 18px; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Google Play reviewer evidence</p>
      <h1>Connected device data transfer</h1>
      <p>This physical-device recording shows GlassAgent connected to compatible glasses, the persistent connected-device foreground-service notification, and a user-requested photo transfer from the glasses to the phone.</p>
    </header>

    <div class="video-frame">
      <video controls playsinline preload="metadata">
        <source src="glassagent-connected-device.mp4" type="video/mp4">
        Your browser does not support embedded MP4 video.
      </video>
    </div>

    <p class="fallback"><a href="glassagent-connected-device.mp4">Open the MP4 directly</a></p>
  </main>
</body>
</html>
